services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/var/www/html
    networks:
      - erp-network

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - erp-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://nginx
    depends_on:
      - backend
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge
